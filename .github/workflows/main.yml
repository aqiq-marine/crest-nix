name: nix-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # - name: Enable Nix cache
      #   uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Lock flake inputs
        run: |
          nix flake lock
          echo "=== generated flake.lock ==="
          cat flake.lock

      - name: Build flake
        run: |
          nix build .#default --show-trace

      - name: Show logs
        if: failure()
        run: |
          for drv in /nix/store/*-crest-*.drv /nix/store/*-xtb-*.drv /nix/store/*-tblite-*.drv; do
            echo "-- $drv"
            nix log "$drv" || true
          done

      - name: Run binary
        run: |
          ./result/bin/crest --help
