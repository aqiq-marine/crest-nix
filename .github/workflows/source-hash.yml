name: Print CREST source hash

on:
  workflow_dispatch:
  push:
    branches:
      - upstream-cmake
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-hash:
    name: Resolve recursive source hash
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate CREST source hash
        id: hash
        shell: bash
        run: |
          set +e
          nix build .#crest --no-link 2>&1 | tee nix-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          # With lib.fakeHash, Nix stops at the fixed-output source fetch
          # and prints the correct recursive hash as 'got:'.
          actual_hash="$(sed -nE 's/.*got:[[:space:]]*(sha256-[A-Za-z0-9+/=]+).*/\1/p' nix-build.log | head -n 1)"

          if [[ -n "$actual_hash" ]]; then
            echo "hash=$actual_hash" >> "$GITHUB_OUTPUT"
            {
              echo "## CREST 3.0.2 recursive source hash"
              echo
              echo '```'
              echo "$actual_hash"
              echo '```'
              echo
              echo 'Copy this value into flake.nix in place of pkgs.lib.fakeHash.'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$actual_hash" > crest-source-hash.txt
            exit 0
          fi

          if [[ "$build_status" -eq 0 ]]; then
            echo "The build succeeded; no fakeHash mismatch was emitted."
            echo "The source hash is no longer needed or fakeHash was replaced."
            exit 0
          fi

          echo "::error::Could not extract a source hash. The build failed for another reason."
          exit "$build_status"

      - name: Upload resolved hash
        if: steps.hash.outputs.hash != ''
        uses: actions/upload-artifact@v4
        with:
          name: crest-source-hash
          path: crest-source-hash.txt
          if-no-files-found: error